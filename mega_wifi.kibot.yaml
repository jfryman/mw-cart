# KiBot configuration file to generate project artifacts
kibot:
  version: 1

global:
  filters:
  - number: 1007
  - number: 1015
  - number: 58

import:
- file: Elecrow
- file: FusionPCB
- file: JLCPCB
- file: MacroFab_XYRS
- file: PCBWay

variants:
  - name: 'default'
    comment: 'Standard PCB configuration'
    type: kibom

outputs:
- name: basic_boardview
  comment: Kibot/Doc/Board View export
  type: boardview
  dir: Kibot/Doc/Assembly
- name: basic_navigate_results
  comment: Web page to browse the results
  type: navigate_results
  dir: Kibot/Browse
  options:
    link_from_root: Kibot/index.html
- name: generic_bom_html
  comment: Generic Bill of Materials in HTML format
  type: bom
  dir: Kibot/Fab/BoM/Generic
  options:
    format: HTML
    group_fields: &id001
    - part
    - part lib
    - value
    - footprint
    - footprint lib
    - voltage
    - tolerance
    - current
    - power
    - lcsc#
    count_smd_tht: true
- name: generic_bom_csv
  comment: Generic Bill of Materials in CSV format
  type: bom
  dir: Kibot/Fab/BoM/Generic
  options:
    format: CSV
    group_fields: *id001
    count_smd_tht: true
- name: generic_bom_xlsx
  comment: Generic Bill of Materials in XLSX format
  type: bom
  dir: Kibot/Fab/BoM/Generic
  options:
    format: XLSX
    group_fields: *id001
    count_smd_tht: true
- name: positional_bom_html
  comment: Positional Bill of Materials in HTML format
  type: bom
  dir: Kibot/Fab/BoM/Positional
  options:
    format: HTML
    group_fields: *id001
    columns: &id002
    - Row
    - Description
    - Part
    - Part Lib
    - References
    - Value
    - Footprint
    - Footprint Lib
    - Quantity Per PCB
    - Build Quantity
    - Status
    - Datasheet
    - Sheetpath
    - Source BoM
    - Footprint X
    - Footprint Y
    - Footprint Rot
    - Footprint Side
    - Footprint Type
    - Footprint Populate
    - Footprint X-Size
    - Footprint Y-Size
    count_smd_tht: true
    html:
      style: modern-red
- name: positional_bom_xlsx
  comment: Positional Bill of Materials in XLSX format
  type: bom
  dir: Kibot/Fab/BoM/Positional
  options:
    format: XLSX
    group_fields: *id001
    columns: *id002
    count_smd_tht: true
    xlsx:
      style: modern-red
- name: basic_excellon
  comment: Drill files in EXCELLON format
  type: excellon
  dir: Kibot/Fab/Gerbers
  options:
    map: pdf
- name: gerber_modern
  comment: Gerbers in modern format, recommended by the standard
  type: gerber
  dir: Kibot/Fab/Gerbers
  layers:
  - layer: F.Cu
    suffix: F_Cu
    description: Front copper
  - layer: B.Cu
    suffix: B_Cu
    description: Bottom copper
  - layer: F.Paste
    suffix: F_Paste
    description: Front solder paste
  - layer: F.Silkscreen
    suffix: F_Silkscreen
    description: Front silkscreen (artwork)
  - layer: B.Mask
    suffix: B_Mask
    description: Bottom soldermask (negative)
  - layer: F.Mask
    suffix: F_Mask
    description: Front soldermask (negative)
  - layer: Edge.Cuts
    suffix: Edge_Cuts
    description: Board shape
  - layer: F.Fab
    suffix: F_Fab
    description: Front documentation
- name: FusionPCB_gerbers
  comment: Gerbers compatible with FusionPCB
  type: gerber
  dir: Kibot/Fab/Manufacturers/FusionPCB
  extends: _FusionPCB_gerbers
  disable_run_by_default: true
  layers: &id003
  - layer: F.Cu
    suffix: F_Cu
    description: Front copper
  - layer: B.Cu
    suffix: B_Cu
    description: Bottom copper
  - layer: F.Paste
    suffix: F_Paste
    description: Front solder paste
  - layer: F.Silkscreen
    suffix: F_Silkscreen
    description: Front silkscreen (artwork)
  - layer: B.Mask
    suffix: B_Mask
    description: Bottom soldermask (negative)
  - layer: F.Mask
    suffix: F_Mask
    description: Front soldermask (negative)
  - layer: Edge.Cuts
    suffix: Edge_Cuts
    description: Board shape
  - layer: F.Fab
    suffix: F_Fab
    description: Front documentation
- name: FusionPCB_drill
  comment: Drill files compatible with FusionPCB
  type: excellon
  dir: Kibot/Fab/Manufacturers/FusionPCB
  extends: _FusionPCB_drill
  disable_run_by_default: true
- name: FusionPCB
  comment: ZIP file for FusionPCB
  type: compress
  dir: Kibot/Fab/Manufacturers
  extends: ''
  disable_run_by_default: _FusionPCB_compress
  options:
    files:
    - from_output: FusionPCB_gerbers
      dest: /
    - from_output: FusionPCB_drill
      dest: /
- name: JLCPCB_gerbers
  comment: Gerbers compatible with JLCPCB
  type: gerber
  dir: Kibot/Fab/Manufacturers/JLCPCB
  extends: _JLCPCB_gerbers
  disable_run_by_default: true
  layers: *id003
- name: JLCPCB_drill
  comment: Drill files compatible with JLCPCB
  type: excellon
  dir: Kibot/Fab/Manufacturers/JLCPCB
  extends: _JLCPCB_drill
  disable_run_by_default: true
- name: JLCPCB_position
  comment: Pick and place file, JLCPCB style
  type: position
  dir: Kibot/Fab/Manufacturers/JLCPCB
  extends: _JLCPCB_position
  disable_run_by_default: true
  options:
    pre_transform:
    - _kicost_rename
    - _rot_footprint
- name: JLCPCB_bom
  comment: BoM for JLCPCB
  type: bom
  dir: Kibot/Fab/Manufacturers/JLCPCB
  extends: _JLCPCB_bom
  disable_run_by_default: true
- name: JLCPCB
  comment: ZIP file for JLCPCB
  type: compress
  dir: Kibot/Fab/Manufacturers
  extends: ''
  disable_run_by_default: _JLCPCB_compress
  options:
    files:
    - from_output: JLCPCB_gerbers
      dest: /
    - from_output: JLCPCB_drill
      dest: /
    - from_output: JLCPCB_position
      dest: /
    - from_output: JLCPCB_bom
      dest: /
- name: Elecrow_gerbers
  comment: Gerbers compatible with Elecrow
  type: gerber
  dir: Kibot/Fab/Manufacturers/Elecrow
  extends: _Elecrow_gerbers
  disable_run_by_default: true
  layers: *id003
- name: Elecrow_drill
  comment: Drill files compatible with Elecrow
  type: excellon
  dir: Kibot/Fab/Manufacturers/Elecrow
  extends: _Elecrow_drill
  disable_run_by_default: true
- name: Elecrow
  comment: ZIP file for Elecrow
  type: compress
  dir: Kibot/Fab/Manufacturers
  extends: ''
  disable_run_by_default: _Elecrow_compress
  options:
    files:
    - from_output: Elecrow_gerbers
      dest: /
    - from_output: Elecrow_drill
      dest: /
- name: PCBWay_gerbers
  comment: Gerbers compatible with PCBWay
  type: gerber
  dir: Kibot/Fab/Manufacturers/PCBWay
  extends: _PCBWay_gerbers
  disable_run_by_default: true
  layers: *id003
- name: PCBWay_drill
  comment: Drill files compatible with PCBWay
  type: excellon
  dir: Kibot/Fab/Manufacturers/PCBWay
  extends: _PCBWay_drill
  disable_run_by_default: true
- name: PCBWay
  comment: ZIP file for PCBWay
  type: compress
  dir: Kibot/Fab/Manufacturers
  extends: ''
  disable_run_by_default: _PCBWay_compress
  options:
    files:
    - from_output: PCBWay_gerbers
      dest: /
    - from_output: PCBWay_drill
      dest: /
- name: basic_info
  comment: Information about the run
  type: info
  dir: Kibot
- name: classic_netlist
  comment: Schematic netlist in KiCad format
  type: netlist
  dir: Kibot/Doc/Export
- name: ipc_netlist
  comment: IPC-D-356 netlist for testing
  type: netlist
  dir: Kibot/Doc/Export
  options:
    format: ipc
- name: basic_pcb_print_pdf
  comment: PCB
  type: pcb_print
  dir: Kibot/Doc/PCB/PDF
  options:
    format: PDF
    pages:
    - layers:
      - layer: F.Cu
      - layer: F.Mask
        color: '#14332440'
      - layer: F.Paste
      - layer: F.Silkscreen
      - layer: Edge.Cuts
      sheet: Front copper
    - layers:
      - layer: B.Cu
      - layer: B.Mask
        color: '#14332440'
      - layer: Edge.Cuts
      mirror: true
      sheet: Bottom copper
    - layers:
      - layer: F.Courtyard
      - layer: Edge.Cuts
      sheet: Front courtyard area
    - layers:
      - layer: F.Fab
      - layer: Edge.Cuts
      sheet: Front documentation
    keep_temporal_files: true
- name: basic_pcbdraw_svg_set_blue_enig_top
  comment: PCB 2D render in SVG format, using set-blue-enig style
  type: pcbdraw
  dir: Kibot/Doc/PCB/2D_render
  options:
    style: set-blue-enig
    format: svg
- name: basic_pcbdraw_png_set_blue_enig_top
  comment: PCB 2D render in PNG format, using set-blue-enig style
  type: pcbdraw
  dir: Kibot/Doc/PCB/2D_render
  options:
    style: set-blue-enig
    format: png
- name: basic_pcbdraw_svg_set_blue_enig_bottom
  comment: PCB 2D render in SVG format, using set-blue-enig style
  type: pcbdraw
  dir: Kibot/Doc/PCB/2D_render
  options:
    style: set-blue-enig
    format: svg
    bottom: true
- name: basic_pcbdraw_png_set_blue_enig_bottom
  comment: PCB 2D render in PNG format, using set-blue-enig style
  type: pcbdraw
  dir: Kibot/Doc/PCB/2D_render
  options:
    style: set-blue-enig
    format: png
    bottom: true
- name: basic_pdf
  comment: Individual layers in PDF format
  type: pdf
  dir: Kibot/Doc/PCB/PDF
  layers:
  - layer: F.Cu
    suffix: F_Cu
    description: Front copper
  - layer: B.Cu
    suffix: B_Cu
    description: Bottom copper
  - layer: F.Paste
    suffix: F_Paste
    description: Front solder paste
  - layer: F.Silkscreen
    suffix: F_Silkscreen
    description: Front silkscreen (artwork)
  - layer: B.Mask
    suffix: B_Mask
    description: Bottom soldermask (negative)
  - layer: F.Mask
    suffix: F_Mask
    description: Front soldermask (negative)
  - layer: Edge.Cuts
    suffix: Edge_Cuts
    description: Board shape
  - layer: F.Fab
    suffix: F_Fab
    description: Front documentation
- name: basic_pdf_sch_print
  comment: Schematic in PDF format
  type: pdf_sch_print
  dir: Kibot/Doc/Schematic
  options:
    monochrome: true
- name: basic_position_ASCII
  comment: Components position for Pick & Place
  type: position
  dir: Kibot/Fab/Position
  options:
    format: ASCII
    only_smd: false
    separate_files_for_front_and_back: false
- name: basic_position_CSV
  comment: Components position for Pick & Place
  type: position
  dir: Kibot/Fab/Position
  options:
    format: CSV
    only_smd: false
    separate_files_for_front_and_back: false
- name: basic_render_3d_30deg
  comment: 3D view from 30 degrees
  type: render_3d
  dir: Kibot/Doc/3D
  output_id: 30deg
  options:
    solder_mask: "#023BA2D4"
    clip_silk_on_via_annulus: false
    width: 3840
    height: 2160
    zoom: 1
    ray_tracing: true
    rotate_x: 3
    rotate_z: 2
    move_y: 1
- name: report_simple
  comment: Simple design report
  type: report
  dir: Kibot
  output_id: _simple
  options:
    template: simple_ASCII
- name: report_full
  comment: Full design report
  type: report
  dir: Kibot
  options:
    template: full_SVG
- name: basic_step
  comment: 3D model in STEP format
  type: step
  dir: Kibot/Doc/3D
- name: basic_vrml
  comment: PCB in VRML format
  type: vrml
  dir: Kibot/Doc/3D
